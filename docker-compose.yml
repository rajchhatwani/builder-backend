services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: builder
      POSTGRES_DB: builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder -d builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      BUILDER_DATABASE_URL: postgresql+asyncpg://builder:builder@postgres:5432/builder
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

volumes:
  postgres_data:
