services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: builder
      POSTGRES_DB: builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder -d builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      BUILDER_DATABASE_URL: postgresql+asyncpg://builder:builder@postgres:5432/builder
      # Needed only to store auth credentials (PUT /projects/{id}/auth/secrets).
      SECRET_KEY: ${SECRET_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts

  # The dashboard: http://localhost:5173 (talks to the API on http://localhost:8000).
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      # File events do not cross Windows/macOS bind mounts, so watch by polling.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
