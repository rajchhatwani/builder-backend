services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: builder
      POSTGRES_PASSWORD: builder
      POSTGRES_DB: builder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the non-superuser API role `builder_app` (first start of a fresh volume only).
      - ./scripts/db/10-app-role.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builder -d builder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      # The API runs as the plain role; only Alembic uses the owner (SEC M-1).
      BUILDER_DATABASE_URL: postgresql+asyncpg://builder_app:builder_app@postgres:5432/builder
      BUILDER_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://builder:builder@postgres:5432/builder
      # Signs sign-in tokens and encrypts stored credentials. The default below is for this laptop
      # setup only: the app refuses it unless BUILDER_ENVIRONMENT is `local`. Set a real one
      # (`openssl rand -base64 48`) anywhere else.
      SECRET_KEY: ${SECRET_KEY:-local-development-only-secret-key-change-me}
      BUILDER_ENVIRONMENT: ${BUILDER_ENVIRONMENT:-local}
      BUILDER_SIGNUP_MODE: ${BUILDER_SIGNUP_MODE:-open}
      # Optional: create the first administrator at startup (no default password on purpose).
      # Or run: docker compose exec api uv run python /app/scripts/create_admin.py you@example.com
      BUILDER_BOOTSTRAP_ADMIN_EMAIL: ${BUILDER_BOOTSTRAP_ADMIN_EMAIL:-}
      BUILDER_BOOTSTRAP_ADMIN_PASSWORD: ${BUILDER_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./scripts:/app/scripts

  # The dashboard: http://localhost:5173 (talks to the API on http://localhost:8000).
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      # File events do not cross Windows/macOS bind mounts, so watch by polling.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
