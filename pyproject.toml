[project]
name = "backend-builder"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "dnspython>=2.9.0",
    "fastapi>=0.156.8",
    "jinja2>=3.1.6",
    "mcp>=1.3.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "reportlab>=5.1.0",
    "signxml>=5.2.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3>=1.38.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    "opentelemetry-instrumentation-asyncpg>=0.66b1,<0.67",
    "opentelemetry-instrumentation-fastapi>=0.66b1,<0.67",
    "opentelemetry-instrumentation-redis>=0.66b1,<0.67",
    "opentelemetry-sdk>=1.45.1,<2",
    "pillow>=13.0.0",
    "pre-commit>=4.7.0",
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.22",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.1",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", "tests/golden", "examples/commerce/backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Copied byte for byte into generated projects (where E501 is off); keep its prose readable.
"app/core/doc_engine.py" = ["E501"]
"app/core/doc_library.py" = ["E501"]
# The examples are readable data and scripts, not library code: long literal lines are fine.
"examples/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["alembic/versions", "tests/golden"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
norecursedirs = ["golden", "fixtures"]
