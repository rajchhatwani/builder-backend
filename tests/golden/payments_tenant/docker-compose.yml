# Settings every payments process shares (the API and the workers).
x-payments-env: &payments-env
  APP_ENV: ${APP_ENV:-development}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env (see .env.example)}
  STRIPE_WEBHOOK_SECRETS: ${STRIPE_WEBHOOK_SECRETS:?set STRIPE_WEBHOOK_SECRETS in .env (see .env.example)}
  PAYMENTS_WEBHOOK_MODE: ${PAYMENTS_WEBHOOK_MODE:-queued}
  STRIPE_API_BASE: ${STRIPE_API_BASE:-https://api.stripe.com}
  PAYMENTS_JOB_LEASE_SECONDS: ${PAYMENTS_JOB_LEASE_SECONDS:-120}
  PAYMENTS_WEBHOOK_IP_ALLOWLIST: ${PAYMENTS_WEBHOOK_IP_ALLOWLIST:?set PAYMENTS_WEBHOOK_IP_ALLOWLIST in .env (see .env.example)}
  DB_PGBOUNCER: "true"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Pools connections to the database: many application connections, few database ones.
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.1-p0
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      DEFAULT_POOL_SIZE: "154"
      MAX_CLIENT_CONN: "1000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U app"]
      interval: 3s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  api:
    build: .
    environment:
      <<: *payments-env
      UVICORN_WORKERS: ${UVICORN_WORKERS:-9}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
      DATABASE_URL: postgresql+asyncpg://app:app@pgbouncer:6432/app
      # Copy .env.example to .env and fill these in; compose reads .env automatically.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env (see .env.example)}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "${API_PORT:-8000}:8000"

  # Runs the queue and the periodic jobs. Scale with `docker compose up --scale payments-worker=N`,
  # or run more of them on other machines with deploy/compose.worker.yml.
  payments-worker:
    build: .
    command: ["python", "-m", "app.payments.worker"]
    environment:
      <<: *payments-env
      DATABASE_URL: postgresql+asyncpg://app:app@pgbouncer:6432/app
      PAYMENTS_WORKER_CONCURRENCY: ${PAYMENTS_WORKER_CONCURRENCY:-8}
      PAYMENTS_POLL_INTERVAL_SECONDS: ${PAYMENTS_POLL_INTERVAL_SECONDS:-0.2}
      DB_POOL_SIZE: ${DB_POOL_SIZE_WORKER:-10}
      DB_MAX_OVERFLOW: "0"
    depends_on:
      db:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-7}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  db_data:
