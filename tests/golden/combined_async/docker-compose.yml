services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      # The master key of the per-tenant credential vault (app/providers). Required: a deployment without
      # one cannot start. Rotation: raise PROVIDER_VAULT_KEY_VERSION and list old keys in ..._PREVIOUS.
      APP_ENV: ${APP_ENV:-production}
      PROVIDER_VAULT_KEY: ${PROVIDER_VAULT_KEY:?set PROVIDER_VAULT_KEY in .env (see .env.example)}
      PROVIDER_VAULT_KEY_VERSION: ${PROVIDER_VAULT_KEY_VERSION:-1}
      PROVIDER_VAULT_KEY_PREVIOUS: ${PROVIDER_VAULT_KEY_PREVIOUS:-}
      # Copy .env.example to .env and fill these in; compose reads .env automatically.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env (see .env.example)}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "${API_PORT:-8000}:8000"

  # Job worker group "default" (4 job(s) at a time per process). Scale with
  # `docker compose up --scale worker-default=N`. Your handlers (app/hooks/jobs.py) may need more settings here.
  worker-default:
    build: .
    command: ["python", "-m", "app.jobs.worker", "--group", "default"]
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      APP_ENV: ${APP_ENV:-production}
      JOBS_CONCURRENCY: ${JOBS_CONCURRENCY_DEFAULT:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE_DEFAULT:-6}
      DB_MAX_OVERFLOW: "0"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  db_data:
