# Settings every payments process shares (the API and the workers).
x-payments-env: &payments-env
  APP_ENV: ${APP_ENV:-development}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID in .env (see .env.example)}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET in .env (see .env.example)}
  RAZORPAY_WEBHOOK_SECRETS: ${RAZORPAY_WEBHOOK_SECRETS:?set RAZORPAY_WEBHOOK_SECRETS in .env (see .env.example)}
  PAYMENTS_WEBHOOK_MODE: ${PAYMENTS_WEBHOOK_MODE:-inline}
  RAZORPAY_API_BASE: ${RAZORPAY_API_BASE:-https://api.razorpay.com}
  PAYMENTS_JOB_LEASE_SECONDS: ${PAYMENTS_JOB_LEASE_SECONDS:-120}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      <<: *payments-env
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      # Copy .env.example to .env and fill these in; compose reads .env automatically.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env (see .env.example)}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "${API_PORT:-8000}:8000"

  # Runs the queue and the periodic jobs. Scale with `docker compose up --scale payments-worker=N`,
  # or run more of them on other machines with deploy/compose.worker.yml.
  payments-worker:
    build: .
    command: ["python", "-m", "app.payments.worker"]
    environment:
      <<: *payments-env
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      PAYMENTS_WORKER_CONCURRENCY: ${PAYMENTS_WORKER_CONCURRENCY:-8}
      PAYMENTS_POLL_INTERVAL_SECONDS: ${PAYMENTS_POLL_INTERVAL_SECONDS:-1.0}
      DB_POOL_SIZE: ${DB_POOL_SIZE_WORKER:-10}
      DB_MAX_OVERFLOW: "0"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  db_data:
