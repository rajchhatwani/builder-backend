services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    volumes:
      - ${REGULATED_KEY_FILE:?set REGULATED_KEY_FILE in .env to the key file on this host (see .env.example)}:/run/secrets/regulated.keys:ro
    environment:
      REGULATED_KEY_FILE: /run/secrets/regulated.keys
      UVICORN_ACCESS_LOG: "false"  # the default access log prints the query string, which can hold a searched value
      COMPLIANCE_EXPORT_SALT: ${COMPLIANCE_EXPORT_SALT:?set COMPLIANCE_EXPORT_SALT in .env (see .env.example)}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      # Copy .env.example to .env and fill these in; compose reads .env automatically.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env (see .env.example)}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  db_data:
