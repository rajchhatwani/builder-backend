name: Deploy

# beta branch  -> the "beta" GitHub environment.   v* tag or manual run -> choose the environment.
# Per environment set: variables BB_DOMAIN, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH (default /opt/builder),
# secrets DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS. App secrets stay on the server in .env (see docs/DEPLOY.md).
on:
  push:
    branches: [beta]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [beta, production]
        default: beta

concurrency:
  group: deploy-${{ inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'beta') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build and push images
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'beta') }}
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - name: Check required variables
        env:
          BB_DOMAIN: ${{ vars.BB_DOMAIN }}
        run: |
          [ -n "$BB_DOMAIN" ] || { echo "::error::BB_DOMAIN is not set for this environment"; exit 1; }
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Production only from the release branch
        env:
          ENVIRONMENT: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'beta') }}
          RELEASE_BRANCH: ${{ vars.PROD_BRANCH || 'main' }}
        run: |
          [ "$ENVIRONMENT" = production ] || exit 0
          git fetch --no-tags origin "$RELEASE_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH" \
            || { echo "::error::production deploys must be commits reachable from $RELEASE_BRANCH"; exit 1; }
      - id: meta
        env:
          ENVIRONMENT: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'beta') }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # the dashboard bakes the environment's API origin, so tags must not be shared across environments
          echo "tag=sha-${GITHUB_SHA::12}-${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${owner}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image (also runs the scheduler and the one-shot migrate jobs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/builder-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/builder-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Dashboard image (Caddy + built frontend; API origin is baked in)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile.web
          push: true
          build-args: |
            VITE_API_BASE_URL=https://${{ vars.BB_DOMAIN }}
            VITE_PREVIEW_API_ORIGIN=${{ vars.PREVIEW_DOMAIN && format('https://{0}', vars.PREVIEW_DOMAIN) || '' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/builder-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Sandbox runner image (always built; the server .env decides whether it is used)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile.runner
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/builder-runner:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/builder-runner:latest
          cache-from: type=gha,scope=runner
          cache-to: type=gha,scope=runner,mode=max
      - name: Preview runtime image (always built)
        uses: docker/build-push-action@v6
        with:
          context: docker/preview-app
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/builder-preview-app:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/builder-preview-app:latest
          cache-from: type=gha,scope=preview
          cache-to: type=gha,scope=preview,mode=max

  deploy:
    name: Deploy to server
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'beta') }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/builder' }}
    steps:
      - name: Check required variables and secrets
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for v in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::$v is not set for this environment"; exit 1; }
          done
      - uses: actions/checkout@v5
      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy stack files
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          $SSH "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes docker-compose.prod.yml \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:$DEPLOY_PATH/docker-compose.yml"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes deploy/prod/deploy.sh deploy/prod/.env.example \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:$DEPLOY_PATH/"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes docker-compose.sandbox.yml docker/prod/preview.caddy \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:$DEPLOY_PATH/"
          $SSH "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" "mkdir -p '$DEPLOY_PATH/scripts'"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes scripts/sandbox_firewall.sh \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:$DEPLOY_PATH/scripts/"
      - name: Pull, migrate, restart, health check
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # token goes over stdin (not the command line) into a throwaway docker config that is removed afterwards
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd '$DEPLOY_PATH' && export DOCKER_CONFIG=\$(mktemp -d) && trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT \
             && docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && BB_IMAGE_PREFIX='${{ needs.images.outputs.prefix }}' bash ./deploy.sh '${{ needs.images.outputs.tag }}'"
