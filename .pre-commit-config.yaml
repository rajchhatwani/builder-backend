repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        # Mirror scripts/gate.sh (E,W,F minus E501, app only); the full pyproject
        # rule set and ruff-format are not satisfied repo-wide.
        args: [--fix, "--select=E,W,F", "--ignore=E501"]
        files: ^app/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy app alembic
        language: system
        pass_filenames: false
